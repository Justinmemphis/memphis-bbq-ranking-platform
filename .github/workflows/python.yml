name: Python

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install ruff
        run: pip install ruff==0.11.2

      - name: Run ruff
        run: ruff check app/

  pip-audit:
    name: Dependency Scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      - name: Run pip-audit
        # Scans app/requirements.txt against the PyPI Advisory Database.
        # Exits non-zero if any vulnerability WITH a fix available is found.
        # --no-deps: only audit packages explicitly listed in requirements.txt,
        #   not their transitive dependencies (boto3's deps are runtime-managed
        #   by AWS and not under our control).
        # If a vuln has no fix, use --ignore-vuln <VULN-ID> with a comment
        # explaining why it is accepted — do not silently suppress.
        run: pip-audit -r app/requirements.txt --no-deps

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-test.txt
      - name: Install test dependencies
        # Install both sets: Lambda runtime deps (boto3 etc.) and test-only deps
        # (moto, pytest, pytest-cov).  Without requirements.txt, Lambda imports
        # inside the handlers would fail at collection time.
        run: pip install -r app/requirements.txt -r app/requirements-test.txt
      - name: Run pytest
        # working-directory must be app/ so that `from shared.auth import ...`
        # and `from lambdas.<name>.handler import handler` resolve correctly —
        # exactly as they do in the Lambda runtime.
        working-directory: app
        run: pytest
