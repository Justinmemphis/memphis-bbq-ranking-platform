name: Python

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.11.2

      - name: Run ruff
        run: ruff check app/

  pip-audit:
    name: Dependency Scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      - name: Run pip-audit
        # Scans app/requirements.txt against the PyPI Advisory Database.
        # Exits non-zero if any vulnerability WITH a fix available is found.
        # --no-deps: only audit packages explicitly listed in requirements.txt,
        #   not their transitive dependencies (boto3's deps are runtime-managed
        #   by AWS and not under our control).
        # If a vuln has no fix, use --ignore-vuln <VULN-ID> with a comment
        # explaining why it is accepted — do not silently suppress.
        run: pip-audit -r app/requirements.txt --no-deps
