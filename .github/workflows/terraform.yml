name: Terraform

on:
  pull_request:
    branches: [main]
    # No path filter — plan + checkov must run on every PR to satisfy required
    # status checks. If only app/** changed, the plan will show 0 infrastructure
    # changes (state refresh only), which is fast and correct.
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/**"
    # Path filter on push only — apply jobs run only when infra actually changes.
    # App-only changes (app/**) are deployed by app-deploy.yml, not this workflow.
  workflow_dispatch:

# Serialize all Terraform-touching workflows against the same state backend.
# app-deploy.yml uses the same group key so the two workflows never race for
# the DynamoDB state lock.
concurrency:
  group: terraform-state
  cancel-in-progress: false

permissions:
  id-token: write        # required for OIDC token exchange
  contents: read
  pull-requests: write   # to post plan output as a PR comment
  security-events: write # required for checkov SARIF upload to GitHub Security tab

jobs:

  # ---------------------------------------------------------------------------
  # Dev
  # ---------------------------------------------------------------------------

  plan-dev:
    name: Plan (dev)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Cache Terraform plugins
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-${{ runner.os }}-

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
          # No static keys — OIDC trust is scoped to this repo

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: mkdir -p $TF_PLUGIN_CACHE_DIR && terraform init

      - name: Terraform Format Check
        working-directory: infra/envs/dev
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: infra/envs/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/envs/dev
        run: terraform plan -no-color
        env:
          TF_VAR_alarm_notification_email: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}

  apply-dev:
    name: Apply (dev)
    # Runs only when infra/** changes land on main (i.e. after a PR is merged).
    # Plan and checkov must have passed on the PR before merge — this job applies
    # the already-reviewed plan. No manual apply should ever run locally.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Cache Terraform plugins
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-${{ runner.os }}-

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: "~1.5"
          # Required so 'terraform output' returns raw values, not wrapped in quotes.
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: mkdir -p $TF_PLUGIN_CACHE_DIR && terraform init

      - name: Terraform Apply
        working-directory: infra/envs/dev
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_alarm_notification_email: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}

      - name: Invalidate CloudFront cache
        working-directory: infra/envs/dev
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

  # ---------------------------------------------------------------------------
  # IaC Security Scan
  # Scans all of infra/ statically — no AWS credentials required.
  # Depends on both plans so it only runs after both environments are validated.
  # ---------------------------------------------------------------------------

  checkov:
    name: IaC Security Scan (checkov)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Static scan — no dependency on plans; runs in parallel to save wall-clock time.

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Run checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          # Fail the job on HIGH or CRITICAL findings only.
          # MEDIUM/LOW generate warnings but do not block merge.
          soft_fail_on: LOW,MEDIUM
          output_format: cli,sarif
          output_file_path: console,results.sarif
          # Skipped rules with documented justifications:
          #   CKV_AWS_115 — Lambda reserved concurrency: not set (Phase 4)
          #   CKV_AWS_116 — Lambda DLQ: not configured (Phase 4)
          #   CKV_AWS_272 — Lambda code signing: using source_code_hash instead
          #   CKV2_AWS_29 — API GW WAF: prod-only, dev intentionally skipped (Phase 3)
          #   CKV_AWS_26  — SNS KMS encryption: Phase 3 prod hardening
          #   CKV_AWS_50  — Lambda X-Ray tracing: Phase 4 observability
          #   CKV_AWS_117 — Lambda in VPC: intentional architecture decision — no VPC;
          #                 Lambda→DynamoDB over AWS network via IAM; VPC adds NAT cost + cold start
          #   CKV_AWS_119 — DynamoDB KMS CMK: AWS-owned key sufficient for dev; Phase 3 prod hardening
          #   CKV_AWS_158 — CloudWatch log groups KMS: logs contain no PII; Phase 3 prod hardening
          #   CKV_AWS_173 — Lambda env var KMS: env vars are table names only, not secrets
          #   CKV_AWS_338 — Log retention ≥ 1 year: dev=14d, prod=60-90d by design; 1yr not required
          #   CKV2_AWS_31 — WAF logging configuration: aws_wafv2_web_acl_logging_configuration IS
          #                 present in infra/modules/waf/main.tf; checkov fails to correlate it with
          #                 the WebACL when both resources use count expressions (checkov version regression)
          #   CKV_AWS_68  — CloudFront WAF: WebACL association wired in Sprint 22 via CLOUDFRONT-scope WebACL
          #   CKV_AWS_86  — CloudFront access logging: not required for portfolio project; CloudWatch metrics sufficient
          #   CKV_AWS_174 — CloudFront TLS 1.2: default CloudFront cert limits minimum_protocol_version to TLSv1;
          #                 custom ACM cert required for TLSv1.2_2021, deferred to Phase 5
          #   CKV_AWS_145 — S3 KMS encryption: AES-256 sufficient for public static assets; KMS adds per-request
          #                 cost without security benefit for non-sensitive content
          #   CKV2_AWS_6  — S3 public access block: aws_s3_bucket_public_access_block IS present in
          #                 static_site module; checkov fails to correlate it with the bucket when both
          #                 resources use count expressions (same version regression as CKV2_AWS_31)
          #   CKV2_AWS_42 — CloudFront custom SSL cert: default CloudFront cert used; no custom domain
          #                 configured for portfolio project; ACM cert deferred to Phase 5
          #   CKV2_AWS_32 — CloudFront response headers policy: not configured for stub static site;
          #                 security headers deferred to Phase 5 with admin UI build-out
          #   CKV_AWS_144 — S3 cross-region replication: single-region portfolio project; no DR requirement
          #   CKV2_AWS_61 — S3 lifecycle configuration: not required for static site; versioning covers rollback
          #   CKV2_AWS_62 — S3 event notifications: no event-driven processing needed for static site
          #   CKV_AWS_374 — CloudFront geo restriction: no geo compliance requirement for portfolio project
          #   CKV_AWS_310 — CloudFront origin failover: single S3 origin; failover not applicable for portfolio
          #   CKV_AWS_355 — IAM wildcard resource: CloudFront list operations (ListDistributions,
          #                 ListOriginAccessControls) do not support resource-level ARN scoping — AWS limitation;
          #                 all write operations are scoped to account-specific ARNs
          #   CKV_AWS_290 — IAM write access without constraints: same as CKV_AWS_355 — list-only actions
          #                 that genuinely require Resource="*"; write actions are properly scoped
          #   CKV_AWS_21  — S3 versioning: aws_s3_bucket_versioning IS present with status=Enabled;
          #                 checkov fails to correlate it with the bucket when both use count expressions
          #                 (same version regression as CKV2_AWS_31 and CKV2_AWS_6)
          #   CKV_AWS_18  — S3 access logging: not required for static site in portfolio project
          #   CKV2_AWS_47 — CloudFront WAF Log4j rule: WAF module includes AWSManagedRulesKnownBadInputsRuleSet
          #                 (covers Log4j); association with CloudFront wired in Sprint 22
          skip_check: CKV_AWS_115,CKV_AWS_116,CKV_AWS_272,CKV2_AWS_29,CKV_AWS_26,CKV_AWS_50,CKV_AWS_117,CKV_AWS_119,CKV_AWS_158,CKV_AWS_173,CKV_AWS_338,CKV2_AWS_31,CKV_AWS_68,CKV_AWS_86,CKV_AWS_174,CKV_AWS_145,CKV2_AWS_6,CKV2_AWS_42,CKV2_AWS_32,CKV_AWS_144,CKV2_AWS_61,CKV2_AWS_62,CKV_AWS_374,CKV_AWS_310,CKV_AWS_355,CKV_AWS_290,CKV_AWS_21,CKV_AWS_18,CKV2_AWS_47

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

  # ---------------------------------------------------------------------------
  # Prod
  # ---------------------------------------------------------------------------

  plan-prod:
    name: Plan (prod)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Cache Terraform plugins
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-${{ runner.os }}-

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: infra/envs/prod
        run: mkdir -p $TF_PLUGIN_CACHE_DIR && terraform init

      - name: Terraform Format Check
        working-directory: infra/envs/prod
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: infra/envs/prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/envs/prod
        run: terraform plan -no-color
        env:
          TF_VAR_alarm_notification_email: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}

  apply-prod:
    name: Apply (prod)
    # Mirrors apply-dev but targets infra/envs/prod.
    # Runs after a PR is merged to main — same CI-only apply model as dev.
    # Security: OIDC trust is scoped to this repo; prod is protected by the
    # 'prod' GitHub environment (can add required reviewers or deployment gates).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Cache Terraform plugins
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-${{ runner.os }}-

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: "~1.5"
          # Required so 'terraform output' returns raw values, not wrapped in quotes.
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/envs/prod
        run: mkdir -p $TF_PLUGIN_CACHE_DIR && terraform init

      - name: Terraform Apply
        working-directory: infra/envs/prod
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_alarm_notification_email: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}

      - name: Invalidate CloudFront cache
        working-directory: infra/envs/prod
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
