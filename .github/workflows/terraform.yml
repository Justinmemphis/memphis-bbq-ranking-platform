name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
  push:
    branches: [main]
    paths:
      - "infra/**"
  workflow_dispatch:

permissions:
  id-token: write       # required for OIDC token exchange
  contents: read
  pull-requests: write  # to post plan output as a PR comment
  security-events: write # required for checkov SARIF upload to GitHub Security tab

jobs:
  plan-dev:
    name: Plan (dev)
    # Run on PRs and manual dispatches only — apply job handles push-to-main.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
          # No static keys — OIDC trust is scoped to this repo and environment

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: terraform init

      - name: Terraform Format Check
        working-directory: infra/envs/dev
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: infra/envs/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/envs/dev
        run: terraform plan -no-color
        env:
          TF_VAR_alarm_notification_email: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}

  plan-prod:
    name: Plan (prod)
    # Mirrors plan-dev but targets infra/envs/prod.
    # Runs on PRs and manual dispatches so prod changes are visible before merge.
    # Uses the 'prod' GitHub environment — secrets must be set there separately.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: infra/envs/prod
        run: terraform init

      - name: Terraform Format Check
        working-directory: infra/envs/prod
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: infra/envs/prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/envs/prod
        run: terraform plan -no-color
        env:
          TF_VAR_alarm_notification_email: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}

  checkov:
    name: IaC Security Scan (checkov)
    runs-on: ubuntu-latest
    # Run after plan so we only scan IaC that is syntactically valid.
    # checkov does NOT require AWS credentials — it analyses static HCL only.
    needs: plan-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Run checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          # Fail the job on HIGH or CRITICAL findings only.
          # MEDIUM/LOW generate warnings but do not block merge.
          soft_fail_on: LOW,MEDIUM
          output_format: cli,sarif
          output_file_path: console,results.sarif
          # Skipped rules with documented justifications:
          #   CKV_AWS_115 — Lambda reserved concurrency: not set (Phase 4)
          #   CKV_AWS_116 — Lambda DLQ: not configured (Phase 4)
          #   CKV_AWS_272 — Lambda code signing: using source_code_hash instead
          #   CKV2_AWS_29 — API GW WAF: prod-only, dev intentionally skipped (Phase 3)
          #   CKV_AWS_26  — SNS KMS encryption: Phase 3 prod hardening
          #   CKV_AWS_50  — Lambda X-Ray tracing: Phase 4 observability
          #   CKV_AWS_117 — Lambda in VPC: intentional architecture decision — no VPC;
          #                 Lambda→DynamoDB over AWS network via IAM; VPC adds NAT cost + cold start
          #   CKV_AWS_119 — DynamoDB KMS CMK: AWS-owned key sufficient for dev; Phase 3 prod hardening
          #   CKV_AWS_158 — CloudWatch log groups KMS: logs contain no PII; Phase 3 prod hardening
          #   CKV_AWS_173 — Lambda env var KMS: env vars are table names only, not secrets
          #   CKV_AWS_338 — Log retention ≥ 1 year: dev=14d, prod=60-90d by design; 1yr not required
          #   CKV2_AWS_31 — WAF logging configuration: aws_wafv2_web_acl_logging_configuration IS
          #                 present in infra/modules/waf/main.tf; checkov fails to correlate it with
          #                 the WebACL when both resources use count expressions (checkov version regression)
          skip_check: CKV_AWS_115,CKV_AWS_116,CKV_AWS_272,CKV2_AWS_29,CKV_AWS_26,CKV_AWS_50,CKV_AWS_117,CKV_AWS_119,CKV_AWS_158,CKV_AWS_173,CKV_AWS_338,CKV2_AWS_31

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

  apply-dev:
    name: Apply (dev)
    # Runs only when infra/** changes land on main (i.e. after a PR is merged).
    # Plan and checkov must have passed on the PR before merge — this job applies
    # the already-reviewed plan. No manual apply should ever run locally.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: terraform init

      - name: Terraform Apply
        working-directory: infra/envs/dev
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_alarm_notification_email: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}

  apply-prod:
    name: Apply (prod)
    # Mirrors apply-dev but targets infra/envs/prod.
    # Runs after a PR is merged to main — same CI-only apply model as dev.
    # Uses the 'prod' GitHub environment which requires AWS_OIDC_ROLE_ARN and
    # ALARM_NOTIFICATION_EMAIL secrets to be set in GitHub → Settings → Environments.
    # Security: the same OIDC role is used for both environments; trust is scoped
    # to this repo (not per-environment). Prod is protected by the 'prod' GitHub
    # environment configuration (can add required reviewers or deployment gates there).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: infra/envs/prod
        run: terraform init

      - name: Terraform Apply
        working-directory: infra/envs/prod
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_alarm_notification_email: ${{ secrets.ALARM_NOTIFICATION_EMAIL }}
